trigger:
  - main

pr: none

pool:
  vmImage: 'ubuntu-24.04'

variables:
  SonarQubeAnalysisBranch: 'refs/heads/main'

steps:

# ============================================================
# 1. Checkout source code
# ============================================================
- checkout: self
  fetchDepth: 0
  displayName: 'Checkout Source Code'


# ============================================================
# 2. Setup Python
# ============================================================
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
    addToPath: true
    architecture: 'x64'
  displayName: 'Setup Python 3.12'


# ============================================================
# 3. Install dependencies
# ============================================================
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest pytest-cov
  displayName: 'Install Dependencies'


# ============================================================
# 4. Run tests + generate coverage
# ============================================================
- script: |
    pytest \
      --cov=. \
      --cov-report=xml:coverage.xml \
      --cov-report=term-missing \
      --junitxml=test-results.xml
  displayName: 'Run Tests and Generate Coverage'


# ============================================================
# 5. Publish test results
# ============================================================
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'test-results.xml'
    failTaskOnFailedTests: true
    testRunTitle: 'Python Unit Tests'
  condition: succeededOrFailed()
  displayName: 'Publish Test Results'


# ============================================================
# 6. Publish code coverage
# ============================================================
- task: PublishCodeCoverageResults@2
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
    reportDirectory: '$(System.DefaultWorkingDirectory)'
    failIfCoverageEmpty: true
  condition: succeededOrFailed()
  displayName: 'Publish Code Coverage'


# ============================================================
# 7. Verify branch
# ============================================================
- script: |
    echo "=============================================="
    echo "Azure DevOps Branch Information"
    echo "=============================================="
    echo "Build.SourceBranch     = $(Build.SourceBranch)"
    echo "Build.SourceBranchName = $(Build.SourceBranchName)"
    echo "Build.Reason           = $(Build.Reason)"
    echo "=============================================="
  displayName: 'Verify Build Branch'


# ============================================================
# 8. Prepare SonarQube
# ============================================================
- task: SonarQubePrepare@8
  condition: eq(variables['Build.SourceBranch'], variables['SonarQubeAnalysisBranch'])
  inputs:
    SonarQube: 'sonarqube-connection'
    scannerMode: 'cli'
    configMode: 'file'
    configFile: 'sonar-project.properties'
  displayName: 'Prepare SonarQube Analysis'


# ============================================================
# 9. Remove automatically injected sonar.branch.name
#    Required for SonarQube Community Edition
# ============================================================
- task: PowerShell@2
  condition: eq(variables['Build.SourceBranch'], variables['SonarQubeAnalysisBranch'])
  displayName: 'Remove SonarQube Branch Parameter'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Checking SonarQube scanner parameters..."

      if ($env:SONARQUBE_SCANNER_PARAMS) {
          Write-Host "SONARQUBE_SCANNER_PARAMS detected."

          $params = $env:SONARQUBE_SCANNER_PARAMS

          Write-Host "Removing sonar.branch.name..."

          $params = $params -replace '"sonar.branch.name":"[^"]*",?', ''

          Write-Host "Updated SonarQube scanner parameters:"
          Write-Host $params

          Write-Host "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$params"
      }
      else {
          Write-Host "SONARQUBE_SCANNER_PARAMS is not present."
      }


# ============================================================
# 10. Run SonarQube Analysis
# ============================================================
- task: SonarQubeAnalyze@8
  condition: eq(variables['Build.SourceBranch'], variables['SonarQubeAnalysisBranch'])
  inputs:
    jdkversion: 'JAVA_HOME_17_X64'
  displayName: 'Run SonarQube Analysis'


# ============================================================
# 11. Publish SonarQube Quality Gate
# ============================================================
- task: SonarQubePublish@8
  condition: eq(variables['Build.SourceBranch'], variables['SonarQubeAnalysisBranch'])
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish SonarQube Quality Gate'
