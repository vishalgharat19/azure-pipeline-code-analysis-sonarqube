trigger:
  - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:

# ============================================================
# 1. Checkout source code
# ============================================================
- checkout: self
  fetchDepth: 0
  displayName: 'Checkout Source Code'


# ============================================================
# 2. Setup Python
# ============================================================
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
  displayName: 'Setup Python 3.12'


# ============================================================
# 3. Install dependencies
# ============================================================
- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
    pip install pytest pytest-cov
  displayName: 'Install Dependencies'


# ============================================================
# 4. Run tests + generate coverage
# ============================================================
- script: |
    pytest \
      --cov=. \
      --cov-report=xml:coverage.xml \
      --cov-report=term
  displayName: 'Run Tests and Generate Coverage'


# ============================================================
# 5. Prepare SonarQube
# ============================================================
- task: SonarQubePrepare@8
  inputs:
    SonarQube: 'sonar-connection'
    scannerMode: 'cli'
    configMode: 'file'
    configFile: 'sonar-project.properties'
  displayName: 'Prepare SonarQube Analysis'


# ============================================================
# 6. Run SonarQube Analysis
# ============================================================
- task: SonarQubeAnalyze@8
  inputs:
    jdkversion: 'JAVA_HOME_17_X64'
  displayName: 'Run SonarQube Analysis'


# ============================================================
# 7. Publish SonarQube Quality Gate
# ============================================================
- task: SonarQubePublish@8
  inputs:
    pollingTimeoutSec: '300'
  displayName: 'Publish SonarQube Quality Gate'
